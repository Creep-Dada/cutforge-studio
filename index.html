<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="light dark">
<title>CutForge Studio</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Colour language: a neutral, almost black stage and one signature – the chromatic split (RGB shift):
   a red and a turquoise ghost a pixel or two beside the shape, like a lens that does not quite align. */
:root {
  --bg: #08090b; --bg2: rgba(255,255,255,.045); --bg3: rgba(255,255,255,.085); --solid2: #121418; --text: #f4f4f2; --hint: #8a8f98;
  --line: rgba(255,255,255,.085); --nav: rgba(18,20,24,.84);
  --red: #ff2d55; --cyan: #18e4d6; --red-a: rgba(255,45,85,.28); --cyan-a: rgba(24,228,214,.16); --cyan-line: rgba(24,228,214,.38);
  --aur-r: rgba(255,45,85,.20); --aur-c: rgba(24,228,214,.15); --tint-r: rgba(255,45,85,.075); --tint-c: rgba(24,228,214,.06);
  --split: -1.5px 0 0 var(--red), 1.5px 0 0 var(--cyan); --split-sm: -1px 0 0 var(--red), 1px 0 0 var(--cyan);
  --glow: 0 0 22px rgba(255,45,85,.18), 0 0 22px rgba(24,228,214,.14);
  --radius: 18px; --spring: cubic-bezier(.16, 1, .3, 1); --ease: cubic-bezier(.2, .8, .2, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-tg]) { --bg: #f5f5f2; --bg2: rgba(0,0,0,.035); --bg3: rgba(0,0,0,.065); --solid2: #ffffff; --text: #111214; --hint: #6a6f78;
    --line: rgba(0,0,0,.08); --nav: rgba(255,255,255,.86); --red: #e8164a; --cyan: #06a196; --red-a: rgba(232,22,74,.16); --cyan-a: rgba(6,161,150,.12);
    --cyan-line: rgba(6,161,150,.4); --aur-r: rgba(232,22,74,.10); --aur-c: rgba(6,161,150,.10); --tint-r: rgba(232,22,74,.05); --tint-c: rgba(6,161,150,.05); }
}
:root[data-light] { --red: #e8164a; --cyan: #06a196; --red-a: rgba(232,22,74,.16); --cyan-a: rgba(6,161,150,.12); --cyan-line: rgba(6,161,150,.4);
  --aur-r: rgba(232,22,74,.10); --aur-c: rgba(6,161,150,.10); --tint-r: rgba(232,22,74,.05); --tint-c: rgba(6,161,150,.05); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.42 var(--font); -webkit-font-smoothing: antialiased; }
body { padding-bottom: calc(84px + env(safe-area-inset-bottom)); overflow-x: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ---------- living background: two soft colour fields drifting (red / turquoise) ---------- */
.aurora { position: fixed; left: 0; right: 0; top: 0; height: 80vh; pointer-events: none; z-index: 0; overflow: hidden; }
.aurora i { position: absolute; width: 95vw; height: 95vw; max-width: 640px; max-height: 640px; border-radius: 50%; will-change: transform; }
.aurora i:first-child { background: radial-gradient(closest-side, var(--aur-r), transparent); left: -22vw; top: -30vw; animation: drift1 19s ease-in-out infinite alternate; }
.aurora i:last-child { background: radial-gradient(closest-side, var(--aur-c), transparent); right: -28vw; top: -8vw; animation: drift2 23s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(26vw, 10vh) scale(1.18); } }
@keyframes drift2 { to { transform: translate(-24vw, 6vh) scale(.88); } }
.wrap { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 20px 16px 8px; }
#main { transform-origin: 50% 0; transition: transform .55s var(--spring), opacity .45s var(--ease); }
body.in-sheet #main { transform: scale(.94); opacity: .4; }

/* ---------- header: the wordmark in RGB split, a short glitch now and then ---------- */
header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; animation: down .8s var(--spring) backwards; }
.brand { position: relative; font-weight: 800; letter-spacing: -.01em; font-size: 22px; text-shadow: var(--split); }
.brand::before, .brand::after { content: attr(data-text); position: absolute; inset: 0; pointer-events: none; opacity: 0; text-shadow: none; }
.brand::before { color: var(--red); animation: glitch1 8s infinite steps(1); }
.brand::after { color: var(--cyan); animation: glitch2 8s infinite steps(1); }
.brand.zap::before { animation: zap1 .42s steps(1); }
.brand.zap::after { animation: zap2 .42s steps(1); }
@keyframes glitch1 { 0%, 92%, 100% { opacity: 0; transform: none; clip-path: none; }
  93% { opacity: .9; transform: translate(-3px, -1px); clip-path: inset(10% 0 55% 0); }
  94.5% { opacity: .9; transform: translate(2px, 1px); clip-path: inset(60% 0 8% 0); }
  96% { opacity: .8; transform: translate(-2px, 0); clip-path: inset(30% 0 40% 0); } }
@keyframes glitch2 { 0%, 92%, 100% { opacity: 0; transform: none; clip-path: none; }
  93.5% { opacity: .9; transform: translate(3px, 1px); clip-path: inset(50% 0 20% 0); }
  95% { opacity: .9; transform: translate(-2px, -1px); clip-path: inset(5% 0 70% 0); }
  96.5% { opacity: .8; transform: translate(2px, 0); clip-path: inset(70% 0 5% 0); } }
@keyframes zap1 { 0% { opacity: .9; transform: translate(-4px, 0); clip-path: inset(15% 0 50% 0); }
  35% { opacity: .9; transform: translate(3px, 1px); clip-path: inset(55% 0 10% 0); } 70%, 100% { opacity: 0; } }
@keyframes zap2 { 0% { opacity: .9; transform: translate(4px, 0); clip-path: inset(60% 0 5% 0); }
  35% { opacity: .9; transform: translate(-3px, -1px); clip-path: inset(5% 0 65% 0); } 70%, 100% { opacity: 0; } }
.ver { color: var(--hint); font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg2); }
.live { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); margin-left: auto; animation: beat 2.6s infinite; }
.live.off { background: var(--hint); animation: none; opacity: .5; }
@keyframes beat { 0% { box-shadow: 0 0 0 0 var(--cyan-line); } 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

/* ---------- search ---------- */
.search-wrap { position: relative; margin-bottom: 8px; animation: down .8s .06s var(--spring) backwards; }
.search { width: 100%; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg2); padding: 0 14px 0 40px; outline: none;
  transition: border-color .25s, box-shadow .3s; }
.search:focus { border-color: transparent; box-shadow: var(--split), var(--glow); }
.search-wrap svg { position: absolute; left: 13px; top: 13px; color: var(--hint); transition: color .3s, transform .45s var(--spring); }
.search-wrap:focus-within svg { color: var(--text); transform: scale(1.1) rotate(-8deg); }

/* ---------- sections, tiles, rows ---------- */
h2 { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--hint); margin: 26px 2px 12px;
  display: flex; align-items: center; gap: 9px; }
h2::before { content: ""; width: 14px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--red), var(--cyan)); }
.ptitle { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 2px 2px 0; text-shadow: var(--split-sm); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile, .row { position: relative; overflow: hidden; isolation: isolate; text-align: left; border: 1px solid var(--line); background: var(--bg2);
  border-radius: var(--radius); transition: transform .4s var(--spring), border-color .3s, box-shadow .3s; }
.tile { padding: 14px 15px 15px; min-height: 128px; display: flex; flex-direction: column; gap: 6px;
  background: radial-gradient(130% 90% at 0 0, var(--tint, transparent), transparent 62%), var(--bg2); }
.grid .tile:nth-child(4n+1), .grid .tile:nth-child(4n+4) { --tint: var(--tint-r); }
.grid .tile:nth-child(4n+2), .grid .tile:nth-child(4n+3) { --tint: var(--tint-c); }
.ic { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 4px;
  background: linear-gradient(135deg, var(--red-a), var(--cyan-a)); box-shadow: inset 0 0 0 1px var(--line); transition: transform .5s var(--spring), box-shadow .3s; }
.tile:active .ic, .row:active .ic { transform: scale(1.1) rotate(-6deg); box-shadow: inset 0 0 0 1px var(--line), var(--glow); }
.tile .t { font-weight: 650; font-size: 15.5px; letter-spacing: -.01em; }
.tile .d { color: var(--hint); font-size: 12.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ic svg { color: var(--text); filter: drop-shadow(-1px 0 var(--red)) drop-shadow(1px 0 var(--cyan)); transition: filter .3s; }
.tile:active, .row:active { transform: scale(.965); }
.tile:active .ic svg, .row:active .ic svg { filter: drop-shadow(-2.5px 0 var(--red)) drop-shadow(2.5px 0 var(--cyan)); }
@media (hover: hover) {
  .tile:hover, .row:hover { border-color: var(--cyan-line); box-shadow: var(--glow); transform: translateY(-2px); }
  .tile:hover .ic svg, .row:hover .ic svg { filter: drop-shadow(-2px 0 var(--red)) drop-shadow(2px 0 var(--cyan)); }
}
/* the touch light: follows the finger, red into turquoise */
.tile::after, .row::after, .seg button::after, .primary::after, .ghost::after { content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0; pointer-events: none;
  background: radial-gradient(170px circle at var(--x, 50%) var(--y, 50%), var(--red-a), var(--cyan-a) 45%, transparent 70%); transition: opacity .6s; }
.lit::after { opacity: 1; transition: opacity .05s; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 15px; margin-bottom: 9px; }
.row .t { font-weight: 650; }
.row .d { color: var(--hint); font-size: 13px; }
.row .grow { flex: 1; min-width: 0; }
.row .ic { margin: 0; }
.row { background: radial-gradient(90% 160% at 0 50%, var(--tint, transparent), transparent 60%), var(--bg2); }
.row:nth-child(odd) { --tint: var(--tint-r); }
.row:nth-child(even) { --tint: var(--tint-c); }
.chev { color: var(--hint); transition: transform .4s var(--spring), color .3s; }
.row:active .chev, .row.lit .chev { transform: translateX(4px); color: var(--cyan); }
.fav { margin-left: auto; color: var(--hint); background: none; border: 0; padding: 4px; transition: color .3s; }
.fav.on { color: var(--red); filter: drop-shadow(0 0 8px var(--red-a)); }
.fav.just { animation: star .7s var(--spring); }
@keyframes star { 0% { transform: scale(.5) rotate(-40deg); } 55% { transform: scale(1.3) rotate(8deg); } 100% { transform: none; } }
.empty { color: var(--hint); text-align: center; padding: 48px 0; animation: rise .5s var(--spring) backwards; }

/* ---------- tab bar with a gliding indicator ---------- */
nav { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); max-width: 620px; margin: 0 auto; height: 62px;
  background: var(--nav); -webkit-backdrop-filter: blur(22px) saturate(1.4); backdrop-filter: blur(22px) saturate(1.4); border: 1px solid var(--line);
  border-radius: 22px; display: flex; z-index: 5; box-shadow: 0 10px 40px rgba(0,0,0,.3);
  animation: up .8s .12s var(--spring) backwards; transition: transform .5s var(--spring), opacity .35s; }
body.in-sheet nav { transform: translateY(150%); opacity: 0; }
nav .pill { position: absolute; top: 6px; bottom: 6px; left: 0; width: 0; border-radius: 16px; background: var(--bg3); pointer-events: none;
  transition: transform .55s var(--spring), width .55s var(--spring); }
nav .pill::after { content: ""; position: absolute; left: 32%; right: 32%; bottom: 4px; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, var(--red), var(--cyan)); box-shadow: 0 0 10px var(--cyan-a); }
nav button { position: relative; z-index: 1; flex: 1; background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; font-size: 11px; color: var(--hint); transition: color .35s; }
nav button svg { transition: transform .55s var(--spring), filter .35s; }
nav button.on { color: var(--text); }
nav button.on svg { transform: translateY(-2px) scale(1.08); filter: drop-shadow(-1px 0 var(--red)) drop-shadow(1px 0 var(--cyan)); }
nav button:active svg { transform: scale(.82); }

/* ---------- sheet: springs up as a card, the page behind steps back ---------- */
.sheet { position: fixed; left: 0; right: 0; top: 10px; bottom: 0; z-index: 10; overflow-y: auto; transform: translateY(105%); background: var(--bg);
  transition: transform .6s var(--spring); padding-bottom: calc(100px + env(safe-area-inset-bottom)); border-radius: 24px 24px 0 0;
  box-shadow: 0 -1px 0 var(--line), 0 -20px 60px rgba(0,0,0,.35); overscroll-behavior: contain; }
.sheet.open { transform: translateY(0); }
.sheet.dragging { transition: none; }
.grip { width: 42px; height: 5px; border-radius: 3px; background: var(--bg3); margin: 0 auto; padding: 0; position: relative; touch-action: none; }
.grip::before { content: ""; position: absolute; inset: -10px -60px; }
.sheet > .grip { margin-top: 8px; }
.sheet .wrap { padding-top: 12px; }
.sheet-head { display: flex; align-items: center; gap: 12px; margin-bottom: 2px; touch-action: none; }
.sheet-head h1 { font-size: 26px; font-weight: 800; margin: 0; letter-spacing: -.02em; flex: 1; text-shadow: var(--split-sm); }
.close { background: var(--bg3); border: 0; border-radius: 999px; width: 34px; height: 34px; display: grid; place-items: center; transition: transform .45s var(--spring); }
.close:active { transform: rotate(90deg) scale(.88); }
.lead { color: var(--hint); margin: 4px 2px 8px; }
.needs { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; padding: 8px 13px; border-radius: 999px; margin: 8px 0 4px;
  background: linear-gradient(var(--bg), var(--bg)) padding-box, linear-gradient(90deg, var(--red), var(--cyan)) border-box; border: 1px solid transparent; }

/* ---------- form controls ---------- */
.field { margin-top: 20px; }
.label { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--hint); margin: 0 2px 9px; display: flex; gap: 8px; }
.label .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
.seg { display: flex; flex-wrap: wrap; gap: 7px; }
.seg button { position: relative; overflow: hidden; isolation: isolate; border: 1px solid var(--line); background: var(--bg2); border-radius: 999px; padding: 9px 15px;
  font-size: 14px; transition: background .35s var(--ease), color .35s, border-color .35s, box-shadow .35s, transform .4s var(--spring); }
.seg button:active { transform: scale(.92); }
.seg button.on { background: var(--text); color: var(--bg); border-color: transparent; box-shadow: var(--split), var(--glow); }
.seg button.just { animation: pop .6s var(--spring); }
@keyframes pop { 0% { transform: scale(.88); box-shadow: -5px 0 0 var(--red), 5px 0 0 var(--cyan); } 100% { transform: none; } }
.seg button:disabled { opacity: .3; }
.seg button small { opacity: .65; margin-left: 4px; }
textarea, .input, select { width: 100%; border: 1px solid var(--line); background: var(--bg2); border-radius: 14px; padding: 13px 15px; outline: none;
  transition: border-color .25s, box-shadow .3s; }
textarea:focus, .input:focus, select:focus { border-color: transparent; box-shadow: var(--split), var(--glow); }
select.just { animation: flash .7s var(--ease); }
@keyframes flash { 0% { box-shadow: -4px 0 0 var(--red), 4px 0 0 var(--cyan), var(--glow); } 100% { box-shadow: none; } }
textarea { min-height: 92px; resize: vertical; }
select { appearance: none; -webkit-appearance: none; height: 48px; padding: 0 15px; background-image: linear-gradient(45deg, transparent 50%, var(--hint) 50%),
  linear-gradient(135deg, var(--hint) 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px;
  background-size: 5px 5px; background-repeat: no-repeat; }
select option { background: var(--solid2); color: var(--text); }
.note { color: var(--hint); font-size: 12.5px; margin: 8px 2px 0; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 15px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg2); }
.switch input { appearance: none; -webkit-appearance: none; flex: none; width: 48px; height: 28px; border-radius: 999px; background: var(--bg3); position: relative; margin: 0;
  transition: box-shadow .4s; }
.switch input::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, var(--red), var(--cyan));
  opacity: 0; transition: opacity .4s var(--ease); }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--text);
  transition: transform .55s var(--spring); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.switch input:checked { box-shadow: var(--glow); }
.switch input:checked::before { opacity: 1; }
.switch input:checked::after { transform: translateX(20px); background: #fff; }
.switch input.just::before { animation: fadein .45s var(--ease) backwards; }
.switch input.just:checked::after { animation: knob-on .6s var(--spring); }
.switch input.just:not(:checked)::after { animation: knob-off .6s var(--spring); }
@keyframes fadein { from { opacity: 0; } }
@keyframes knob-on { from { transform: translateX(0) scale(.9); } }
@keyframes knob-off { from { transform: translateX(20px) scale(.9); } }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--bg2); }
.stepper button { background: none; border: 0; width: 44px; height: 40px; font-size: 19px; transition: transform .35s var(--spring); }
.stepper button:active { transform: scale(.78); }
.stepper span { min-width: 30px; text-align: center; font-weight: 700; display: inline-block; }
.stepper span.up { animation: num-up .5s var(--spring); }
.stepper span.down { animation: num-down .5s var(--spring); }
@keyframes num-up { 0% { transform: translateY(10px) scale(1.25); opacity: 0; text-shadow: var(--split); } 100% { transform: none; opacity: 1; } }
@keyframes num-down { 0% { transform: translateY(-10px) scale(1.25); opacity: 0; text-shadow: var(--split); } 100% { transform: none; opacity: 1; } }
details { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 14px; }
summary { color: var(--hint); font-size: 13px; cursor: pointer; list-style: none; display: flex; align-items: center; gap: 9px; }
summary::before { content: "+"; flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--bg3);
  font-size: 15px; transition: transform .5s var(--spring), background .3s, color .3s; }
details[open] summary::before { transform: rotate(135deg); background: var(--text); color: var(--bg); }
summary::-webkit-details-marker { display: none; }
.summary { margin-top: 24px; padding: 15px; border-radius: var(--radius); font-size: 13.5px;
  background: linear-gradient(var(--solid2), var(--solid2)) padding-box, linear-gradient(120deg, var(--red-a), var(--cyan-line)) border-box; border: 1px solid transparent; }
.summary b { font-weight: 650; }
.summary.just { animation: sum .6s var(--ease); }
@keyframes sum { 0% { box-shadow: var(--glow); transform: scale(.985); } 100% { box-shadow: none; transform: none; } }

/* ---------- primary button (browser; inside Telegram the native MainButton) ---------- */
.primary { position: fixed; left: 16px; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom)); height: 54px; border-radius: 18px; border: 0;
  overflow: hidden; isolation: isolate; color: #fff; font-weight: 700; font-size: 16px; letter-spacing: .01em; z-index: 11; max-width: 608px; margin: 0 auto;
  background: linear-gradient(110deg, var(--red), #b23ad8 50%, var(--cyan)); background-size: 220% 100%;
  animation: btn-in .6s var(--spring) backwards, flow 7s ease-in-out infinite alternate;
  box-shadow: 0 10px 28px rgba(255,45,85,.3), 0 10px 28px rgba(24,228,214,.18); transition: transform .4s var(--spring), filter .3s; }
.primary::before { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,.32) 50%, transparent 65%);
  transform: translateX(-120%); animation: shine 4.2s ease-in-out infinite; }
.primary:active { transform: scale(.97); }
.primary:disabled { filter: grayscale(.85) brightness(.75); }
.primary:disabled::before { display: none; }
@keyframes flow { to { background-position: 100% 0; } }
@keyframes shine { 0%, 62% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
@keyframes btn-in { from { transform: translateY(24px) scale(.96); opacity: 0; } }
body:not(.in-sheet) .primary { bottom: calc(84px + env(safe-area-inset-bottom)); }
body.has-send:not(.in-sheet) { padding-bottom: calc(154px + env(safe-area-inset-bottom)); }
.code { font: 12.5px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; word-break: break-all; padding: 15px; border-radius: 14px; user-select: all;
  background: linear-gradient(var(--solid2), var(--solid2)) padding-box, linear-gradient(120deg, var(--red), var(--cyan)) border-box; border: 1px solid transparent; }
.ghost { position: relative; overflow: hidden; isolation: isolate; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--bg2);
  border: 1px solid var(--line); border-radius: 14px; padding: 13px 15px; width: 100%; margin-top: 10px; transition: transform .4s var(--spring), box-shadow .4s, border-color .4s; }
.ghost:active { transform: scale(.97); }
.ghost.done { border-color: transparent; box-shadow: var(--split), var(--glow); animation: pop .6s var(--spring); }
.hidden { display: none !important; }

/* ---------- entrances ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.98); } }
@keyframes down { from { opacity: 0; transform: translateY(-10px); } }
@keyframes up { from { opacity: 0; transform: translateY(30px); } }
@keyframes from-right { from { opacity: 0; transform: translateX(28px); } }
@keyframes from-left { from { opacity: 0; transform: translateX(-28px); } }
.pre { opacity: 0; }
.enter { animation: rise .65s var(--spring) backwards; animation-delay: calc(var(--i, 0) * 40ms + var(--base, 0ms)); }
.sheet .enter { --base: 90ms; }
#view.go-right { animation: from-right .5s var(--spring) backwards; }

/* ---------- order code (same as orders.py: CF1.<base64url JSON>.<crc32 & 0xFFFFFF>) ---------- */
const CRC = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(bytes) { let c = 0xFFFFFFFF; for (const b of bytes) c = CRC[(c ^ b) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

  const body = btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return `CF1.${body}.${(crc32(bytes) & 0xFFFFFF).toString(16).padStart(6, "0")}`;
}

    return { v, k: "vid", src: f.src, t: f.t.trim(), m: f.m, c: f.c, a: f.src === "text" && f.a === "auto" ? "16:9" : f.a, s: f.s, q: f.q, r: f.r, o: f.o, n: f.n };
  }
  if (tab === "img") { const f = imageForm; return { v, k: "img", src: f.src, t: f.t.trim(), m: f.src === "text" ? f.m : [], a: f.a, r: f.r, n: f.n }; }
  return null;
}
function orderProblem(o) {
  if (!o) return "";
  if ((o.k === "fx" || o.k === "vid" || o.k === "img") && (!o.m || (!o.m.length && o.k !== "img"))) return "Bitte ein Modell wählen";
  if (o.k === "vid" && o.src === "text" && !o.t) return "Bitte beschreiben, was passieren soll";
  if (o.k === "img" && !o.t) return "Bitte beschreiben, was zu sehen sein soll";
  return "";
}
function summaryText(o) {
  if (o.k === "fx" || o.k === "vid") {
    const mins = minutes(o.m, o.s, o.r, o.o) * (o.n || 1);
    return `<b>${o.m.map(title).join(" + ")}</b> · ${o.r} nativ${o.o ? ` → ${o.o} umgewandelt` : ""} · ${o.s} s${(o.n || 1) > 1 ? ` · ${o.n} Clips` : ""}<br><span style="color:var(--hint)">Rechenzeit etwa ${mins} min, dazu Wartezeit in der Warteschlange.</span>`;
  }
  if (o.k === "img") return `<b>${(o.m.length ? o.m : ["qwen21"]).map(title).join(" + ")}</b> · ${o.r.toUpperCase()} · ${o.a}${(o.n || 1) > 1 ? ` · ${o.n} Bilder` : ""}<br><span style="color:var(--hint)">Etwa ${o.r === "2k" ? 3 : 1} min je Bild.</span>`;
  return `<span style="color:var(--hint)">Das Ergebnis kommt in den Chat, sobald es fertig ist.</span>`;
}
function updateSend() {
  const o = currentOrder();
  const sum = document.getElementById(sheet ? "sheetBody" : "view").querySelector("#sum");
  if (sum && o) {
    const h = summaryText(o);
    sum.innerHTML = h;
    if (lastSum !== null && h !== lastSum) replay(sum, "just");
    lastSum = h;
  }
  const problem = orderProblem(o);
  const btn = document.getElementById("send");
  if (inTelegram) {
    btn.classList.add("hidden");
    if (o) {
      const css = getComputedStyle(document.documentElement);
      tg.MainButton.setParams({ text: problem || "Auftrag senden", is_active: !problem, is_visible: true, has_shine_effect: !problem,
        color: problem ? css.getPropertyValue("--hint").trim() || undefined : css.getPropertyValue("--red").trim() || undefined, text_color: "#ffffff" });
    } else tg.MainButton.hide();
  } else {
    btn.classList.toggle("hidden", !o);
    document.body.classList.toggle("has-send", !!o);
    btn.textContent = problem || "Auftrag als Code";
    btn.disabled = !!problem;
  }
}
function send() {
  const o = currentOrder();
  if (!o || orderProblem(o)) return;
  haptic("medium");
  if (inTelegram) {
    try { tg.sendData(JSON.stringify(o)); return; } catch (e) { /* not opened from the bot's keyboard: show the code */ }
  }
  showCode(encodeOrder(o));
}
function showCode(code) {
  sheet = { kind: "code" };
  document.getElementById("sheetBody").innerHTML = `<div class="sheet-head"><h1>Dein Auftrag</h1><button class="close" data-close>${icon("close", 16)}</button></div>`
    + `<p class="lead">Kopiere den Code und schick ihn deinem CutForge-Bot in Telegram. Er fragt dann nach den Fotos oder Videos.</p>`
    + `<div class="code" id="code">${esc(code)}</div><button class="ghost" id="copy">${icon("copy", 16)} Kopieren</button>`;
  stagger(document.getElementById("sheetBody").children);
  decode(document.getElementById("code"), code);
  document.getElementById("sheet").scrollTop = 0;
  document.getElementById("sheet").classList.add("open");
  document.body.classList.add("in-sheet");
  document.getElementById("send").classList.add("hidden");
  document.getElementById("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(code); const c = document.getElementById("copy"); c.textContent = "Kopiert ✓"; c.classList.add("done"); haptic("medium"); }
    catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById("code")); getSelection().removeAllRanges(); getSelection().addRange(r); }
  };
}

function decode(el, text) {
  if (reduced) return;
  const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
  const t0 = performance.now(), dur = 900;
  const step = (now) => {
    const k = Math.min(1, (now - t0) / dur), fixed = Math.floor(text.length * k * k * (3 - 2 * k));
    let out = text.slice(0, fixed);
    for (let i = fixed; i < text.length; i++) out += text[i] === "." ? "." : abc[(Math.random() * abc.length) | 0];
    el.textContent = out;
    if (k < 1 && el.isConnected) requestAnimationFrame(step); else el.textContent = text;
  };
  requestAnimationFrame(step);
}

/* ---------- events ---------- */
function formOf(key) { const [scope, k] = key.split("."); return [scope === "vid" ? videoForm : scope === "img" ? imageForm : sheetForm, k, scope]; }
function rerender(scope) { if (scope === "vid" || scope === "img") render(); else renderSheet(); }
document.addEventListener("click", (ev) => {
  const sum = ev.target.closest("summary");
  if (sum) { const d = sum.parentElement; advOpen = !d.open; if (advOpen) setTimeout(() => stagger(d.querySelectorAll(":scope > :not(summary)")), 0); tick(); return; }
  const t = ev.target.closest("button, [data-open]");
  if (!t) return;
  if (t.dataset.tab) {
    const from = TABS.findIndex((x) => x[0] === tab), to = TABS.findIndex((x) => x[0] === t.dataset.tab);
    if (from === to) { window.scrollTo({ top: 0, behavior: reduced ? "auto" : "smooth" }); return; }
    tab = t.dataset.tab; tick(); window.scrollTo(0, 0); intro = to > from ? "right" : "left"; render(); zap(); return;
  }
  if (t.dataset.open) { const [k, id] = t.dataset.open.split(":"); openSheet(k, id); return; }
  if (t.hasAttribute("data-close")) { closeSheet(); return; }
  if (t.dataset.fav) { toggleFav(t.dataset.fav); renderSheet(); pop(`.sheet [data-fav="${t.dataset.fav}"]`); return; }
  if (t.id === "send") { send(); return; }
  const segEl = t.closest("[data-seg]");
  if (segEl && t.dataset.v !== undefined) {
    const [form, k, scope] = formOf(segEl.dataset.seg);
    let v = t.dataset.v; if (/^\d+$/.test(v) && k !== "r" && k !== "o") v = Number(v);
    if (segEl.dataset.multi) { const cur = form[k]; form[k] = cur.includes(v) ? (cur.length > 1 ? cur.filter((x) => x !== v) : cur) : [...cur, v]; }
    else form[k] = v;
    tick(); rerender(scope); pop(`[data-seg="${segEl.dataset.seg}"] [data-v="${CSS.escape(t.dataset.v)}"]`); return;
  }
  const st = t.closest("[data-step]");
  if (st) {
    const [form, k, scope] = formOf(st.dataset.step), d = Number(t.dataset.d), before = form[k];
    form[k] = Math.max(1, Math.min(4, form[k] + d));
    if (form[k] === before) { haptic("rigid"); return; }
    tick(); rerender(scope); pop(`[data-step="${st.dataset.step}"] span`, d > 0 ? "up" : "down");
  }
});
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.id === "search") { query = el.value; render(); el.focus(); return; }
  if (el.dataset.in) { const [form, k] = formOf(el.dataset.in); form[k] = el.value; updateSend(); }
});
document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.dataset.sel) { const [form, k, scope] = formOf(el.dataset.sel); form[k] = el.value; tick(); rerender(scope); pop(`[data-sel="${el.dataset.sel}"]`); }
  if (el.dataset.tog) { const [form, k, scope] = formOf(el.dataset.tog); form[k] = el.checked; haptic(); rerender(scope); pop(`[data-tog="${el.dataset.tog}"]`); }
});
document.getElementById("send").onclick = send;

/* touch light: a soft red-turquoise glow under the finger */
const LIT = ".tile, .row, .seg button, .primary, .ghost";
document.addEventListener("pointerdown", (ev) => {
  const el = ev.target.closest(LIT);
  if (!el || el.disabled) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty("--x", `${ev.clientX - r.left}px`); el.style.setProperty("--y", `${ev.clientY - r.top}px`);
  el.classList.add("lit");
  const off = () => { el.classList.remove("lit"); window.removeEventListener("pointerup", off); window.removeEventListener("pointercancel", off); };
  window.addEventListener("pointerup", off); window.addEventListener("pointercancel", off);
}, { passive: true });

/* the sheet follows your finger down and closes past a threshold */
(() => {
  const sh = document.getElementById("sheet");
  let y0 = null, dy = 0, t0 = 0, dragging = false, swallow = false;
  sh.addEventListener("pointerdown", (ev) => {
    if (!ev.target.closest(".grip, .sheet-head") || sh.scrollTop > 0) return;
    y0 = ev.clientY; t0 = performance.now(); dy = 0; dragging = false;
  });
  window.addEventListener("pointermove", (ev) => {
    if (y0 === null) return;
    dy = Math.max(0, ev.clientY - y0);
    if (!dragging && dy > 6) { dragging = true; sh.classList.add("dragging"); }
    if (dragging) {
      sh.style.transform = `translateY(${dy}px)`;
      const main = document.getElementById("main"), k = Math.min(1, dy / 400);
      main.style.transition = "none"; main.style.transform = `scale(${0.94 + 0.06 * k})`; main.style.opacity = String(0.4 + 0.6 * k);
    }
  });
  const end = () => {
    if (y0 === null) return;
    const speed = dy / Math.max(1, performance.now() - t0), main = document.getElementById("main");
    y0 = null; sh.classList.remove("dragging"); sh.style.transform = "";
    main.style.transition = ""; main.style.transform = ""; main.style.opacity = "";
    if (dragging) { swallow = true; if (dy > 110 || speed > 0.6) { haptic(); closeSheet(); } }
    dragging = false;
  };
  window.addEventListener("pointerup", end); window.addEventListener("pointercancel", end);
  sh.addEventListener("click", (ev) => { if (swallow) { swallow = false; ev.stopPropagation(); ev.preventDefault(); } }, true);
  sh.addEventListener("pointerdown", () => { swallow = false; }, true);
})();

/* the colour fields drift a little slower than the page */
(() => {
  const au = document.querySelector(".aurora");
  if (!au || reduced) return;
  let queued = false;
  window.addEventListener("scroll", () => {
    if (queued) return; queued = true;
    requestAnimationFrame(() => { queued = false; au.style.transform = `translateY(${-Math.min(window.scrollY, 1200) * 0.25}px)`; });
  }, { passive: true });
})();
window.addEventListener("resize", () => movePill(true));

/* ---------- start ---------- */
if (inTelegram) {
  tg.ready(); tg.expand(); applyTheme();
  tg.onEvent("themeChanged", () => { applyTheme(); updateSend(); });
  tg.MainButton.onClick(send);
  tg.BackButton.onClick(closeSheet);
}
document.getElementById("live").classList.toggle("off", !inTelegram);
document.getElementById("live").title = inTelegram ? "In Telegram geöffnet" : "Im Browser – der Auftrag wird ein Code zum Kopieren";
loadFavs(() => { intro = "first"; render(); });
</script>
</body>
</html>
