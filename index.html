<style>
:root {

}
@media (prefers-color-scheme: light) {

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { text-align: left; border: 1px solid var(--line); background: var(--bg2); border-radius: var(--radius); padding: 14px; min-height: 108px;
  display: flex; flex-direction: column; gap: 6px; transition: transform .12s ease, border-color .12s ease; }
.tile:active { transform: scale(.98); }

.field { margin-top: 18px; }

.seg button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

select { appearance: none; height: 46px; padding: 0 14px; background-image: linear-gradient(45deg, transparent 50%, var(--hint) 50%),

  background-size: 5px 5px; background-repeat: no-repeat; }
.note { color: var(--hint); font-size: 12.5px; margin: 7px 2px 0; }

.switch input:checked { background: var(--accent); }

.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--bg2); }
.stepper button { background: none; border: 0; width: 40px; height: 36px; font-size: 18px; }
.stepper span { min-width: 28px; text-align: center; font-weight: 600; }

.summary b { font-weight: 600; }

.ghost { background: none; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; width: 100%; margin-top: 10px; }
.hidden { display: none !important; }
.empty { color: var(--hint); text-align: center; padding: 40px 0; }

/* ---------- Telegram look ---------- */
function applyTheme() {
  if (!inTelegram) return;
  const t = tg.themeParams || {}, r = document.documentElement.style;
  document.documentElement.setAttribute("data-tg", "");
  if (t.bg_color) r.setProperty("--bg", t.bg_color);
  if (t.secondary_bg_color) { r.setProperty("--bg2", t.secondary_bg_color); r.setProperty("--bg3", t.secondary_bg_color); }
  if (t.section_bg_color) r.setProperty("--bg2", t.section_bg_color);
  if (t.text_color) { r.setProperty("--text", t.text_color); r.setProperty("--accent", t.text_color); }
  if (t.hint_color) r.setProperty("--hint", t.hint_color);
  if (t.bg_color) r.setProperty("--on-accent", t.bg_color);
  if (t.section_separator_color) r.setProperty("--line", t.section_separator_color);
  try { tg.setHeaderColor(t.bg_color || "#0e0f11"); tg.setBackgroundColor(t.bg_color || "#0e0f11"); } catch (e) { /* older clients */ }
}
const haptic = (k = "light") => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(k); } catch (e) { /* none */ } };

  else { try { parse(localStorage.getItem("cf.favs")); } catch (e) { parse("[]"); } }
}

  favs = favs.includes(id) ? favs.filter((x) => x !== id) : [...favs, id];

  haptic(); render();
}

/* ---------- order code (same as orders.py: CF1.<base64url JSON>.<crc32 & 0xFFFFFF>) ---------- */
const CRC = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(bytes) { let c = 0xFFFFFFFF; for (const b of bytes) c = CRC[(c ^ b) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function encodeOrder(o) {
  const bytes = new TextEncoder().encode(JSON.stringify(o));
  let bin = ""; for (const b of bytes) bin += String.fromCharCode(b);
  const body = btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return `CF1.${body}.${(crc32(bytes) & 0xFFFFFF).toString(16).padStart(6, "0")}`;
}

const resKey = (m) => (m.startsWith("minimax") ? "minimax" : m);
const short = (r) => parseInt(r, 10) || 0;
function nativeFor(model, wanted) {
  const list = (MENU.video[resKey(model)] || { render: [] }).render.map((r) => r.id);
  if (list.includes(wanted)) return wanted;
  const below = list.filter((r) => short(r) <= short(wanted));
  return below.length ? below[below.length - 1] : list[0] || wanted;
}
function minutes(models, secs, render, out) {
  let m = 0;
  for (const id of models) {
    const per5 = id === "minimax" ? 2.5 : id === "hunyuan15" ? 2 : ({ "540p": 2, "720p": 3, "1080p": 7.5, "1440p": 15, "2160p": 30 })[nativeFor(id, render)] || 3;
    m += per5 * secs / 5 + (out && short(out) > short(nativeFor(id, render)) ? 13 * secs / 5 : 0);
  }
  return Math.max(1, Math.round(m));
}

const seg = (name, options, value, attrs = "") => `<div class="seg" data-seg="${name}" ${attrs}>${options.map(([v, label, dis, extra]) =>

const field = (label, body, aside = "", note = "") => `<div class="field"><div class="label">${label}${aside ? `<span class="aside">${aside}</span>` : ""}</div>${body}${note ? `<p class="note">${note}</p>` : ""}</div>`;
const aspectOptions = (auto) => [...(auto ? [["auto", "Wie das Foto"]] : []), ...MENU.aspects.map((a) => [a.id, a.label])];
const select = (name, options, value) => `<select data-sel="${name}">${options.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(value) ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
const stepper = (name, value) => `<div class="stepper" data-step="${name}"><button data-d="-1">−</button><span>${value}</span><button data-d="1">+</button></div>`;
const toggle = (name, label, on) => `<label class="switch"><span>${label}</span><input type="checkbox" data-tog="${name}" ${on ? "checked" : ""}></label>`;
function renderControls(models, f) {
  const first = models[0] || "ltx25";
  const natives = [...new Set(models.flatMap((m) => (MENU.video[resKey(m)] || { render: [] }).render.map((r) => r.id)))].sort((a, b) => short(a) - short(b));
  const render = models.length === 1 ? nativeFor(first, f.r) : f.r;
  const notes = models.map((m) => { const n = nativeFor(m, f.r); return `${esc(title(m))}: ${n}${n === f.r ? " nativ" : " (höchste native Größe)"}`; }).join(" · ");
  const outs = [["", `Wie erzeugt · ${render}`], ...MENU.upscale.filter((u) => short(u.id) > short(render)).map((u) => [u.id, `${u.id} umgewandelt`])];
  return field("Erzeugen in", seg("r", natives.map((r) => [r, r, false, "nativ"]), f.r), "", notes)
    + field("Ausgabe", seg("o", outs.map(([v, l]) => [v, l]), short(f.o) > short(render) ? f.o : ""), "", "Größer als erzeugt = KI-Schärfen mit SeedVR2 (dauert). Gleich groß = keine Wartezeit.");
}

    + field("Qualität", seg("vid.q", [["schnell", "Schnell"], ["gut", "Gut"], ["maximal", "Maximal"]], f.q))
    + renderControls(models, { r: f.r, o: f.o }).replace(/data-seg="r"/, 'data-seg="vid.r"').replace(/data-seg="o"/, 'data-seg="vid.o"')
    + field("Varianten", stepper("vid.n", f.n))
    + `<div class="summary" id="sum"></div>`;
}

function imageFormHtml() {
  const f = imageForm;
  const t2i = f.src === "text";
  const models = t2i ? f.m : ["qwen21"];
  const sizes = (MENU.image[models[0]] || { render: [] }).render;
  return `<h1 style="font-size:24px;margin:2px 2px 0;font-weight:650">Bild</h1><p class="lead" style="margin:2px 2px 0">Neu erzeugen oder ein Foto verändern.</p>`
    + field("Ausgangspunkt", seg("img.src", [["text", "Text"], ["edit1", "Foto ändern"], ["edit2", "Zwei Fotos"]], f.src), "",
      t2i ? "" : f.src === "edit1" ? "Danach schickst du dem Bot das Foto." : "Danach schickst du zwei Fotos.")
    + field("Beschreibung", `<textarea data-in="img.t" placeholder="${t2i ? "Was soll zu sehen sein? Deutsch oder Englisch" : "Was soll sich ändern? z. B. „mach daraus einen Winterabend“"}">${esc(f.t)}</textarea>`)
    + (t2i ? field("Modell", seg("img.m", available(MENU.imageModels).map((m) => [m.id, m.title]), "", 'data-multi="1"').replace(/data-v="([^"]+)" class=""/g, (s, id) => (f.m.includes(id) ? `data-v="${id}" class="on"` : s)))
      + field("Format", select("img.a", aspectOptions(false), f.a))
      + field("Größe", seg("img.r", sizes.map((r) => [r.id, r.id.toUpperCase(), false, "nativ"]), f.r), "",
        esc((sizes.find((r) => r.id === f.r) || {}).sizes ? `${sizes.find((r) => r.id === f.r).sizes[f.a]} px · ${(sizes.find((r) => r.id === f.r) || {}).note}` : "")) : "")
    + field("Varianten", stepper("img.n", f.n))
    + `<div class="summary" id="sum"></div>`;
}

/* ---------- sheets (effect, app) ---------- */
const sheetForm = {};
function openSheet(kind, id) {
  haptic();
  if (kind === "fx") {
    const e = MENU.effects.find((x) => x.id === id);
    const rec = vModels.some((m) => m.id === e.empfohlen) ? e.empfohlen : "ltx25";
    sheet = { kind, item: e };
    Object.assign(sheetForm, { t: "", m: [rec], a: "auto", r: "720p", o: "", s: e.seconds, i: "normal", c: "none", n: 1, mu: false, le: false, p: e.prompt });
  } else {
    const a = MENU.apps.find((x) => x.id === id);
    sheet = { kind, item: a };
    Object.assign(sheetForm, { t: "", q: "gut" });
  }
  renderSheet();
  document.getElementById("sheet").classList.add("open");
  document.body.classList.add("in-sheet");
  if (inTelegram) { tg.BackButton.show(); }
}
function closeSheet() {
  sheet = null;
  document.getElementById("sheet").classList.remove("open");
  document.body.classList.remove("in-sheet");
  if (inTelegram) tg.BackButton.hide();
  updateSend();
}
function renderSheet() {
  const b = document.getElementById("sheetBody");
  if (!sheet) return;
  const f = sheetForm;
  if (sheet.kind === "fx") {
    const e = sheet.item;
    const models = f.m;
    const hasMinimax = models.includes("minimax");
    const ltxOnly = models.every((m) => m === "ltx25");
    const motion = MENU.motions.find((m) => m.id === e.motion);
    b.innerHTML = `<div class="sheet-head"><h1>${esc(e.title)}</h1><button class="fav ${favs.includes(e.id) ? "on" : ""}" data-fav="${e.id}" title="Favorit">${icon("star", 22, favs.includes(e.id) ? "currentColor" : "none")}</button><button class="close" data-close>${icon("close", 16)}</button></div>`
      + `<p class="lead">${esc(e.desc)}</p><span class="needs">${icon("image", 16)} Danach schickst du: ${f.le && ltxOnly ? "Foto + Endbild" : "1 Foto"}</span>`
      + field("Wer oder was ist zu sehen?", `<input class="input" data-in="fx.t" value="${esc(f.t)}" placeholder="optional, englisch – z. B. „a woman in a red dress“">`)
      + field("Modell", seg("fx.m", vModels.map((m) => [m.id, m.title + (m.id === e.empfohlen ? " ★" : "")]), "", 'data-multi="1"').replace(/data-v="([^"]+)" class=""/g, (s, id) => (models.includes(id) ? `data-v="${id}" class="on"` : s)),
        "", `★ empfohlen: ${esc(e.empfohlen_grund || "")}`)
      + field("Intensität", seg("fx.i", [["sanft", "Sanft"], ["normal", "Normal"], ["extrem", "Extrem"]], f.i))
      + field("Länge", seg("fx.s", [3, 4, 5, 6, 8, 10].map((s) => [s, `${s} s`, hasMinimax && s < 5]), hasMinimax ? Math.max(5, f.s) : f.s))
      + `<details><summary>Feinheiten – Format, Auflösung, Kamera, Ton, Endbild, Effekt-Text</summary>`
      + (models.length === 1 && models[0] === "minimax" ? "" : field("Format", select("fx.a", aspectOptions(true), f.a)))
      + renderControls(models, { r: f.r, o: f.o }).replace(/data-seg="r"/, 'data-seg="fx.r"').replace(/data-seg="o"/, 'data-seg="fx.o"')
      + field("Kamera", select("fx.c", [["none", `Effekt-Standard · ${motion ? motion.title : e.motion}`], ...MENU.motions.filter((m) => m.id !== "none").map((m) => [m.id, m.title])], f.c))
      + field("Varianten", stepper("fx.n", f.n))
      + `<div class="field">${toggle("fx.mu", "Ohne Ton", f.mu)}</div>`
      + (ltxOnly ? `<div class="field">${toggle("fx.le", "Endbild – das Motiv verwandelt sich in ein zweites Foto", f.le)}</div>` : "")
      + field("Effekt-Text", `<textarea data-in="fx.p">${esc(f.p)}</textarea>`, "", "Englisch. {subject} steht für das, was zu sehen ist.")
      + `</details><div class="summary" id="sum"></div>`;
  } else {
    const a = sheet.item;
    const needs = a.input === "video" ? (a.reference ? "das Video + ein Foto der Figur" : "das Video") : (a.reference ? "ein Foto der Figur" : "nichts weiter");
    const label = a.audio === "tts" ? "Sprechertext (deutsch)" : a.audio === "music" ? "Musikstil, z. B. „ruhiges Klavier, warm“" : a.maskText ? "Was soll weg? (englisch, z. B. „lamp post“)"
      : a.openjutsu === "object" ? "Was soll sich ändern? (englisch, z. B. „hair“)" : a.openjutsu === "simple" ? "Rolle der Figur (optional)" : a.generate ? "Wie geht es weiter? (englisch)" : "Beschreibung (optional, englisch)";
    b.innerHTML = `<div class="sheet-head"><h1>${esc(a.title)}</h1><button class="close" data-close>${icon("close", 16)}</button></div>`
      + `<p class="lead">${esc(a.desc)}</p><span class="needs">${icon(a.input === "video" ? "video" : "image", 16)} Danach schickst du: ${needs}</span>`
      + (a.id === "oj_mask" ? "" : field(a.audio === "tts" ? "Text" : a.audio === "music" ? "Stil" : "Anweisung",
        `<textarea data-in="app.t" placeholder="${esc(label)}">${esc(f.t)}</textarea>`))
      + (a.audio ? "" : field("Qualität", seg("app.q", [["schnell", "Schnell"], ["gut", "Gut"], ["maximal", "Maximal"]], f.q)))
      + `<div class="summary" id="sum"></div>`;
  }
  updateSend();
}

/* ---------- the order ---------- */
function currentOrder() {
  const v = MENU.version;
  if (sheet && sheet.kind === "fx") {
    const f = sheetForm, e = sheet.item;
    const hasMinimax = f.m.includes("minimax");
    const ltxOnly = f.m.every((m) => m === "ltx25");
    const o = { v, k: "fx", e: e.id, m: f.m, a: f.a, r: f.r, o: f.o, s: hasMinimax ? Math.max(5, f.s) : f.s, i: f.i, c: f.c, n: f.n, mu: f.mu ? 1 : 0, t: f.t.trim() };
    if (f.le && ltxOnly) o.le = 1;
    if (f.p.trim() !== e.prompt) o.p = f.p;
    return o;
  }
  if (sheet && sheet.kind === "app") return { v, k: "app", e: sheet.item.id, q: sheetForm.q, t: sheetForm.t.trim() };
  if (tab === "vid") {
    const f = videoForm;
    return { v, k: "vid", src: f.src, t: f.t.trim(), m: f.m, c: f.c, a: f.src === "text" && f.a === "auto" ? "16:9" : f.a, s: f.s, q: f.q, r: f.r, o: f.o, n: f.n };
  }
  if (tab === "img") { const f = imageForm; return { v, k: "img", src: f.src, t: f.t.trim(), m: f.src === "text" ? f.m : [], a: f.a, r: f.r, n: f.n }; }
  return null;
}
function orderProblem(o) {
  if (!o) return "";
  if ((o.k === "fx" || o.k === "vid" || o.k === "img") && (!o.m || (!o.m.length && o.k !== "img"))) return "Bitte ein Modell wählen";
  if (o.k === "vid" && o.src === "text" && !o.t) return "Bitte beschreiben, was passieren soll";
  if (o.k === "img" && !o.t) return "Bitte beschreiben, was zu sehen sein soll";
  return "";
}
function summaryText(o) {
  if (o.k === "fx" || o.k === "vid") {
    const mins = minutes(o.m, o.s, o.r, o.o) * (o.n || 1);
    return `<b>${o.m.map(title).join(" + ")}</b> · ${o.r} nativ${o.o ? ` → ${o.o} umgewandelt` : ""} · ${o.s} s${(o.n || 1) > 1 ? ` · ${o.n} Clips` : ""}<br><span style="color:var(--hint)">Rechenzeit etwa ${mins} min, dazu Wartezeit in der Warteschlange.</span>`;
  }
  if (o.k === "img") return `<b>${(o.m.length ? o.m : ["qwen21"]).map(title).join(" + ")}</b> · ${o.r.toUpperCase()} · ${o.a}${(o.n || 1) > 1 ? ` · ${o.n} Bilder` : ""}<br><span style="color:var(--hint)">Etwa ${o.r === "2k" ? 3 : 1} min je Bild.</span>`;
  return `<span style="color:var(--hint)">Das Ergebnis kommt in den Chat, sobald es fertig ist.</span>`;
}
function updateSend() {
  const o = currentOrder();
  const sum = document.getElementById(sheet ? "sheetBody" : "view").querySelector("#sum");
  if (sum && o) sum.innerHTML = summaryText(o);
  const problem = orderProblem(o);
  const btn = document.getElementById("send");
  if (inTelegram) {
    btn.classList.add("hidden");
    if (o) {
      tg.MainButton.setParams({ text: problem || "Auftrag senden", is_active: !problem, is_visible: true,
        color: getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || undefined,
        text_color: getComputedStyle(document.documentElement).getPropertyValue("--on-accent").trim() || undefined });
    } else tg.MainButton.hide();
  } else {
    btn.classList.toggle("hidden", !o);
    document.body.classList.toggle("has-send", !!o);
    btn.textContent = problem || "Auftrag als Code";
    btn.disabled = !!problem;
  }
}
function send() {
  const o = currentOrder();
  if (!o || orderProblem(o)) return;
  haptic("medium");
  if (inTelegram) {
    try { tg.sendData(JSON.stringify(o)); return; } catch (e) { /* not opened from the bot's keyboard: show the code */ }
  }
  showCode(encodeOrder(o));
}
function showCode(code) {
  sheet = { kind: "code" };
  document.getElementById("sheetBody").innerHTML = `<div class="sheet-head"><h1>Dein Auftrag</h1><button class="close" data-close>${icon("close", 16)}</button></div>`
    + `<p class="lead">Kopiere den Code und schick ihn deinem CutForge-Bot in Telegram. Er fragt dann nach den Fotos oder Videos.</p>`
    + `<div class="code" id="code">${esc(code)}</div><button class="ghost" id="copy">${icon("copy", 16)} Kopieren</button>`;
  document.getElementById("sheet").classList.add("open");
  document.body.classList.add("in-sheet");
  document.getElementById("send").classList.add("hidden");
  document.getElementById("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(code); document.getElementById("copy").textContent = "Kopiert ✓"; haptic(); }
    catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById("code")); getSelection().removeAllRanges(); getSelection().addRange(r); }
  };
}

/* ---------- events ---------- */
function formOf(key) { const [scope, k] = key.split("."); return [scope === "vid" ? videoForm : scope === "img" ? imageForm : sheetForm, k, scope]; }
function rerender(scope) { if (scope === "vid" || scope === "img") render(); else renderSheet(); }
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("button, [data-open]");
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; haptic(); window.scrollTo(0, 0); render(); return; }
  if (t.dataset.open) { const [k, id] = t.dataset.open.split(":"); openSheet(k, id); return; }
  if (t.hasAttribute("data-close")) { closeSheet(); return; }
  if (t.dataset.fav) { toggleFav(t.dataset.fav); renderSheet(); return; }
  if (t.id === "send") { send(); return; }
  const segEl = t.closest("[data-seg]");
  if (segEl && t.dataset.v !== undefined) {
    const [form, k, scope] = formOf(segEl.dataset.seg);
    let v = t.dataset.v; if (/^\d+$/.test(v) && k !== "r" && k !== "o") v = Number(v);
    if (segEl.dataset.multi) { const cur = form[k]; form[k] = cur.includes(v) ? (cur.length > 1 ? cur.filter((x) => x !== v) : cur) : [...cur, v]; }
    else form[k] = v;
    haptic(); rerender(scope); return;
  }
  const st = t.closest("[data-step]");
  if (st) { const [form, k, scope] = formOf(st.dataset.step); form[k] = Math.max(1, Math.min(4, form[k] + Number(t.dataset.d))); haptic(); rerender(scope); }
});
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.id === "search") { query = el.value; render(); el.focus(); return; }
  if (el.dataset.in) { const [form, k] = formOf(el.dataset.in); form[k] = el.value; updateSend(); }
});
document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.dataset.sel) { const [form, k, scope] = formOf(el.dataset.sel); form[k] = el.value; rerender(scope); }
  if (el.dataset.tog) { const [form, k, scope] = formOf(el.dataset.tog); form[k] = el.checked; haptic(); rerender(scope); }
});
document.getElementById("send").onclick = send;

/* ---------- start ---------- */
if (inTelegram) {
  tg.ready(); tg.expand(); applyTheme();
  tg.onEvent("themeChanged", () => { applyTheme(); updateSend(); });
  tg.MainButton.onClick(send);
  tg.BackButton.onClick(closeSheet);
}
loadFavs(render);
</script>
</body>
</html>
